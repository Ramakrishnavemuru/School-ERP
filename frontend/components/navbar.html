<!-- Reusable App Navbar Template -->
<header class="app-navbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-outline-secondary sidebar-toggle-btn" onclick="components.toggleSidebar()">
      ☰
    </button>
    <h5 class="m-0 fw-bold d-none d-sm-block text-dark" id="navbar-page-title">School ERP</h5>
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="dropdown">
      <button class="btn btn-light position-relative p-2" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false" onclick="components.loadNotifications()">
        🔔
        <span id="notif-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2" aria-labelledby="notifDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;" id="notif-menu">
        <li class="dropdown-header fw-bold">Notifications</li>
        <li class="text-muted small text-center py-3">No notifications</li>
      </ul>
    </div>
    <div class="dropdown">
      <button class="navbar-user-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="user-avatar-placeholder" id="navbar-user-avatar">U</div>
        <div class="text-start d-none d-md-block">
          <div id="navbar-user-name" style="font-size:0.85rem; font-weight:600;">User</div>
          <div id="navbar-user-role" style="font-size:0.7rem; color:var(--text-muted);">Role</div>
        </div>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0">
        <li><a class="dropdown-item text-danger fw-semibold" href="javascript:void(0)" onclick="auth.logout()">🚪 Log Out</a></li>
      </ul>
    </div>
  </div>
</header>
