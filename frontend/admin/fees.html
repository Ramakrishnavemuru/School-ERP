<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fees &amp; Payments - School/College ERP</title>
  <link rel="stylesheet" href="/frontend/css/bootstrap.min.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
  <link rel="stylesheet" href="/frontend/css/tables.css">
  <link rel="stylesheet" href="/frontend/css/responsive.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>
    <div class="main-wrapper">
      <div id="navbar-container"></div>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h2 class="page-title">Fees &amp; Payments</h2>
            <div class="page-subtitle">Configure fee structures, track dues, and record payment collections</div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#recordPaymentModal">
              💵 Record Payment
            </button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createFeeModal">
              + New Fee Structure
            </button>
          </div>
        </div>

        <!-- Tabs for Fee Structures & Recent Transactions -->
        <ul class="nav nav-tabs mb-4" id="feesTab" role="tablist">
          <li class="nav-item">
            <button class="nav-link active fw-bold" id="structures-tab" data-bs-toggle="tab" data-bs-target="#structures-pane" type="button">
              📋 Fee Structures
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link fw-bold" id="payments-tab" data-bs-toggle="tab" data-bs-target="#payments-pane" type="button">
              💳 Payment Transactions
            </button>
          </li>
        </ul>

        <div class="tab-content" id="feesTabContent">
          <!-- Fee Structures Pane -->
          <div class="tab-pane fade show active" id="structures-pane" role="tabpanel">
            <div class="table-custom-wrapper">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Class</th>
                    <th>Amount</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="fees-table-body">
                  <tr><td colspan="6" class="text-center py-4 text-muted">Loading fee structures...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Payment Transactions Pane -->
          <div class="tab-pane fade" id="payments-pane" role="tabpanel">
            <div class="table-custom-wrapper">
              <table class="table-custom">
                <thead>
                  <tr>
                    <th>Admission No</th>
                    <th>Student Name</th>
                    <th>Fee Structure</th>
                    <th>Amount Paid</th>
                    <th>Date &amp; Method</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="payments-table-body">
                  <tr><td colspan="6" class="text-center py-4 text-muted">Loading payments...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Create Fee Structure Modal -->
        <div class="modal fade" id="createFeeModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="create-fee-form" onsubmit="feesManager.createFee(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Create Fee Structure</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Fee Title *</label>
                    <input type="text" name="title" class="form-control" required placeholder="e.g. Term 1 Tuition Fee">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Fee Category *</label>
                    <select name="fee_type" class="form-select" required>
                      <option value="Tuition">Tuition</option>
                      <option value="Admission">Admission</option>
                      <option value="Exam">Exam</option>
                      <option value="Library">Library</option>
                      <option value="Transport">Transport</option>
                      <option value="Hostel">Hostel</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Target Class</label>
                    <select name="class_id" id="fee-class-id" class="form-select">
                      <option value="">All Classes</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Amount ($) *</label>
                    <input type="number" step="0.01" name="amount" class="form-control" required placeholder="e.g. 500.00">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Due Date *</label>
                    <input type="date" name="due_date" class="form-control" required>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="2" placeholder="Fee remarks or terms..."></textarea>
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">Save Fee Structure</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Record Payment Modal -->
        <div class="modal fade" id="recordPaymentModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <form id="record-payment-form" onsubmit="feesManager.recordPayment(event)">
                <div class="modal-header">
                  <h5 class="modal-title fw-bold">Record Student Payment</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <div class="mb-3">
                    <label class="form-label">Fee Structure *</label>
                    <select name="fee_id" id="payment-fee-id" class="form-select" required>
                      <option value="">Select Fee Structure</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Student *</label>
                    <select name="student_id" id="payment-student-id" class="form-select" required>
                      <option value="">Select Student</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Amount Paid ($) *</label>
                    <input type="number" step="0.01" name="amount_paid" class="form-control" required placeholder="e.g. 500.00">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Payment Date</label>
                    <input type="date" name="payment_date" id="payment-date" class="form-control">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Payment Method *</label>
                    <select name="payment_method" class="form-select" required>
                      <option value="Cash">Cash</option>
                      <option value="Online">Online / Card</option>
                      <option value="Bank Transfer">Bank Transfer</option>
                      <option value="Cheque">Cheque</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Transaction / Reference ID</label>
                    <input type="text" name="transaction_id" class="form-control" placeholder="e.g. TXN-998812">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Remarks</label>
                    <input type="text" name="remarks" class="form-control" placeholder="Payment remarks">
                  </div>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-success">Record Payment</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/frontend/js/bootstrap.bundle.min.js"></script>
  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script src="/frontend/js/permissions.js"></script>
  <script src="/frontend/js/utils.js"></script>
  <script src="/frontend/js/components.js"></script>
  <script src="/frontend/js/fees.js"></script>
  <script>
    if (permissions.enforcePageAccess(['ADMIN'])) {
      components.renderLayout('Fees & Payments');
      feesManager.initAdmin();
      loadStudentsForPayment();
      document.getElementById('payment-date').value = new Date().toISOString().split('T')[0];
    }

    async function loadStudentsForPayment() {
      try {
        const res = await api.get('/students', { page_size: 100 });
        const sel = document.getElementById('payment-student-id');
        if (sel && res.items) {
          sel.innerHTML = '<option value="">Select Student</option>' +
            res.items.map(s => `<option value="${s.id}">${s.user ? s.user.full_name : ''} (${s.admission_number})</option>`).join('');
        }
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
